<!DOCTYPE html>

<title>مصروفي</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600&display=swap">
<style>
/* ===== Liquid Glass — ثابت بلا حركة | Design Tokens ===== */
:root{
/* الألوان: فاتح (الافتراضي) */
--bg:#F0F3F8;--cd:#fbfcfe;--ink:#101D32;--mu:#43587a;--ac:#263D5C;--on:#F0F3F8;--gd:#a06d17;--rd:#b23a3a;--gr:#1d7a56;
--ln:rgba(38,61,92,.16);--fld:rgba(255,255,255,.62);--sf2:rgba(38,61,92,.07);color-scheme:light;
/* الزجاج */
--glass:rgba(255,255,255,.56);--glass-strong:rgba(255,255,255,.78);--glass-border:rgba(255,255,255,.85);--glass-hi:rgba(255,255,255,.9);--scrim:rgba(16,29,50,.38);
--blur:blur(12px) saturate(1.4);--blur-lg:blur(18px) saturate(1.5);
--sh-1:0 1px 3px rgba(16,29,50,.08);--sh-2:0 8px 24px rgba(16,29,50,.14);
--bg-a:rgba(120,152,189,.42);--bg-b:rgba(199,216,235,.9);--bg-c:rgba(38,61,92,.14);--bg-1:#f4f7fc;--bg-2:#e4ecf6;
/* المسافات: مضاعفات 4px */
--s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:20px;--s6:24px;--s8:32px;
/* الزوايا */
--r-sm:8px;--r-md:12px;--r-lg:16px;--r-xl:20px;--r-full:999px;
/* الخطوط */
--font:"IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;
--fs-2xs:11px;--fs-xs:12px;--fs-sm:13px;--fs-md:14px;--fs-input:16px;--fs-lg:18px;--fs-xl:clamp(26px,8vw,32px);
--fw-regular:400;--fw-strong:600;--lh-tight:1.3;--lh-base:1.55;
/* الأبعاد (مدمجة) */
--h-ctl:40px;--h-ctl-sm:32px;--h-bar:44px;--h-nav:56px;--h-row:44px;
--ic:20px;--dot:8px;--bar-h:6px;--chart-h:120px;--chart-plot:72px;--w-page:640px;--w-pop:380px;--bd:1px;
--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);--sal:env(safe-area-inset-left,0px);--sar:env(safe-area-inset-right,0px);
--gx:max(var(--s3),var(--sal),var(--sar));
box-sizing:border-box;padding-top:var(--sat)}
:root[data-theme="dark"]{--bg:#0b1424;--cd:#13223a;--ink:#F0F3F8;--mu:#a9bbd3;--ac:#8fb0d8;--on:#0b1424;--gd:#e3b45a;--rd:#ff8f8f;--gr:#6fd9b0;
--ln:rgba(199,216,235,.18);--fld:rgba(11,20,36,.5);--sf2:rgba(199,216,235,.08);color-scheme:dark;
--glass:rgba(38,61,92,.48);--glass-strong:rgba(28,48,78,.82);--glass-border:rgba(199,216,235,.2);--glass-hi:rgba(199,216,235,.22);--scrim:rgba(0,0,0,.6);
--sh-1:0 1px 3px rgba(0,0,0,.35);--sh-2:0 10px 28px rgba(0,0,0,.5);
--bg-a:rgba(120,152,189,.26);--bg-b:rgba(199,216,235,.08);--bg-c:rgba(70,110,170,.26);--bg-1:#0b1424;--bg-2:#101D32}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]):not([data-theme="dark"]){--bg:#0b1424;--cd:#13223a;--ink:#F0F3F8;--mu:#a9bbd3;--ac:#8fb0d8;--on:#0b1424;--gd:#e3b45a;--rd:#ff8f8f;--gr:#6fd9b0;
--ln:rgba(199,216,235,.18);--fld:rgba(11,20,36,.5);--sf2:rgba(199,216,235,.08);color-scheme:dark;
--glass:rgba(38,61,92,.48);--glass-strong:rgba(28,48,78,.82);--glass-border:rgba(199,216,235,.2);--glass-hi:rgba(199,216,235,.22);--scrim:rgba(0,0,0,.6);
--sh-1:0 1px 3px rgba(0,0,0,.35);--sh-2:0 10px 28px rgba(0,0,0,.5);
--bg-a:rgba(120,152,189,.26);--bg-b:rgba(199,216,235,.08);--bg-c:rgba(70,110,170,.26);--bg-1:#0b1424;--bg-2:#101D32}}

/* ===== الأساس والخلفية الثابتة ===== */
*,*::before,*::after{box-sizing:border-box}
:root[data-motion="off"] *,:root[data-motion="off"] *::before,:root[data-motion="off"] *::after{transition:none!important;animation:none!important}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}}
html{background:var(--bg);-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;min-width:0;overflow-x:clip;overflow-wrap:break-word;color:var(--ink);background:transparent;font:var(--fw-regular) var(--fs-md)/var(--lh-base) var(--font);-webkit-font-smoothing:antialiased}
body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
background:radial-gradient(60% 40% at 90% 0%,var(--bg-a),transparent 70%),radial-gradient(55% 40% at 0% 55%,var(--bg-b),transparent 70%),radial-gradient(60% 40% at 100% 100%,var(--bg-c),transparent 70%),linear-gradient(170deg,var(--bg-1),var(--bg-2))}
main{min-width:0;max-width:var(--w-page);margin:0 auto;padding:var(--s3) var(--gx) calc(var(--h-nav) + var(--sab) + var(--s6))}
main>*{min-width:0;max-width:100%}
h1{font-size:var(--fs-lg);line-height:var(--lh-tight);margin:var(--s1) 0 var(--s3);font-weight:var(--fw-strong)}
h2{font-size:var(--fs-sm);line-height:var(--lh-tight);margin:var(--s5) 0 var(--s2);font-weight:var(--fw-strong);color:var(--mu)}
small{display:block;color:var(--mu);font-size:var(--fs-xs);line-height:var(--lh-base)}
b{font-weight:var(--fw-strong)}.g{color:var(--gr)}.r{color:var(--rd)}p{margin:0}
b[data-n],.hero b,.g2 b,.row2>b,.t td,.cb em{font-variant-numeric:tabular-nums}

/* ===== الأسطح الزجاجية ===== */
.card,.list,.t,.bars,.al{background:var(--glass);border:var(--bd) solid var(--glass-border);border-radius:var(--r-lg);box-shadow:inset 0 1px 0 var(--glass-hi),var(--sh-1)}
.g2,.hero{background:var(--glass);border:var(--bd) solid var(--glass-border);border-radius:var(--r-lg);box-shadow:inset 0 1px 0 var(--glass-hi),var(--sh-1);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur)}
.list,.g2,.t{overflow:hidden}
.card{padding:var(--s3);margin-bottom:var(--s2)}
.card .top{display:flex;justify-content:space-between;align-items:flex-start;gap:var(--s2)}
.top>*,.row2>*{min-width:0}.top>span{flex:none}
.card h3{margin:0 0 var(--s1);font-size:var(--fs-md);line-height:var(--lh-tight);font-weight:var(--fw-strong)}
.card small+small{margin-top:var(--s1)}
.card>b{display:block;font-size:var(--fs-md);line-height:var(--lh-tight)}
.mut{margin:var(--s1) 0 var(--s3);color:var(--mu);font-size:var(--fs-sm)}
.card textarea{margin-top:var(--s2)}
.al{padding:var(--s2) var(--s3);margin-bottom:var(--s2);font-size:var(--fs-sm);border-radius:var(--r-md);border-color:var(--gd);background:color-mix(in srgb,var(--gd) 16%,var(--glass-strong))}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));margin-top:var(--s2)}
.g2>div{padding:var(--s3);min-width:0}
.g2>div:nth-child(odd){border-inline-end:var(--bd) solid var(--ln)}
.g2>div:nth-child(n+3){border-top:var(--bd) solid var(--ln)}
.g2 b{display:block;font-size:var(--fs-md);line-height:var(--lh-tight)}
.row2{display:flex;justify-content:space-between;align-items:center;gap:var(--s3);min-height:var(--h-row);padding:var(--s2) var(--s3);border-bottom:var(--bd) solid var(--ln);cursor:pointer}
.row2>b{flex:none;max-width:50%;text-align:end}.row2:last-child{border:0}
.empty{padding:var(--s5) var(--s3);text-align:center;color:var(--mu)}

/* ===== بطاقة الرصيد ===== */
.hero{padding:var(--s4);border-color:var(--glass-border);background:linear-gradient(color-mix(in srgb,var(--ac) 16%,transparent),color-mix(in srgb,var(--ac) 16%,transparent)),var(--glass)}
.hero small{color:var(--mu)}
.hero b{display:block;font-size:var(--fs-xl);font-weight:var(--fw-strong);line-height:var(--lh-tight);margin-top:var(--s1)}
.sc{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--s2);margin-top:var(--s2)}

/* ===== الجداول والمؤشرات ===== */
.t{width:100%;border-collapse:separate;border-spacing:0}
.t td,.t th{padding:var(--s2);text-align:start;font-size:var(--fs-sm);line-height:var(--lh-tight);border-bottom:var(--bd) solid var(--ln)}
.t td:first-child,.t th:first-child{padding-inline-start:var(--s3)}.t td:last-child,.t th:last-child{padding-inline-end:var(--s3)}
.t tr:last-child td{border-bottom:0}
.t th{color:var(--mu);font-size:var(--fs-xs);font-weight:var(--fw-strong);background:var(--sf2)}
.scs{max-height:240px;overflow:auto;margin-top:var(--s2);border-radius:var(--r-md)}
details>summary{min-height:var(--h-ctl-sm);display:flex;align-items:center}
.bar{height:var(--bar-h);background:var(--sf2);border:var(--bd) solid var(--ln);border-radius:var(--r-full);margin:var(--s2) 0;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ac)}
.bars{display:flex;gap:var(--s2);align-items:flex-end;height:var(--chart-h);padding:var(--s3)}
.bc{flex:1;min-width:0;text-align:center}
.bp{display:flex;gap:var(--s1);align-items:flex-end;height:var(--chart-plot);justify-content:center}
.bp i{width:40%;display:block;min-height:2px;border-radius:var(--s1) var(--s1) 0 0}
.ib{background:var(--gr)}.eb{background:var(--rd)}
.lg{display:flex;flex-wrap:wrap;gap:var(--s3);font-size:var(--fs-xs);color:var(--mu);margin-top:var(--s2)}
.cb{display:flex;align-items:center;gap:var(--s2);margin-bottom:var(--s2);font-size:var(--fs-sm)}
.cb span{flex:0 1 72px;min-width:0}.cb .bar{flex:1 1 auto;min-width:var(--s6);margin:0}.cb em{flex:none;font-style:normal;min-width:84px;text-align:end}
.tag{display:inline-block;font-size:var(--fs-xs);line-height:var(--lh-base);padding:0 var(--s2);border:var(--bd) solid var(--ln);border-radius:var(--r-full);color:var(--mu);background:var(--sf2);white-space:nowrap}
.tag.r{color:var(--rd);border-color:var(--rd);background:color-mix(in srgb,var(--rd) 12%,transparent)}
.tag.gd{color:var(--gr);border-color:var(--gr);background:color-mix(in srgb,var(--gr) 12%,transparent)}
#sd{flex:none;width:var(--dot);height:var(--dot);border-radius:50%;background:#8b93a7;box-shadow:0 0 0 3px var(--sf2)}
#sd[data-s="ok"]{background:var(--gr)}#sd[data-s="busy"]{background:var(--gd)}#sd[data-s="err"]{background:var(--rd)}#sd[data-s="off"]{background:#8b93a7}

/* ===== الأزرار والحقول ===== */
.btn{font:inherit;font-weight:var(--fw-strong);font-size:var(--fs-sm);line-height:var(--lh-tight);min-height:var(--h-ctl);cursor:pointer;color:var(--on);background:var(--ac);border:var(--bd) solid var(--glass-border);border-radius:var(--r-md);padding:var(--s2) var(--s3);box-shadow:inset 0 1px 0 var(--glass-hi)}
.btn.g{background:var(--glass-strong);color:var(--ink);border-color:var(--glass-border)}
.btn.s{min-height:var(--h-ctl-sm);padding:var(--s1) var(--s3);font-size:var(--fs-xs);border-radius:var(--r-sm)}
.btn.d{background:var(--glass-strong);color:var(--rd);border-color:var(--rd)}
.act{display:flex;gap:var(--s2);margin-top:var(--s2);flex-wrap:wrap}
.stk{display:flex;flex-direction:column;gap:var(--s2);margin-top:var(--s2)}.stk .btn{width:100%}
.chips{display:flex;flex-wrap:wrap;gap:var(--s2);margin:var(--s2) 0}
.chip{font:inherit;font-size:var(--fs-sm);min-height:var(--h-ctl-sm);padding:var(--s1) var(--s3);border-radius:var(--r-full);color:var(--ink);cursor:pointer;background:var(--glass-strong);border:var(--bd) solid var(--glass-border)}
.chip.on{background:var(--ac);color:var(--on);font-weight:var(--fw-strong)}
.seg{display:flex;gap:var(--s1);padding:var(--s1);margin-top:var(--s2);background:var(--sf2);border:var(--bd) solid var(--ln);border-radius:var(--r-md)}
.seg button{flex:1;min-width:0;min-height:var(--h-ctl-sm);font:inherit;font-size:var(--fs-sm);border:0;background:transparent;color:var(--ink);padding:var(--s1) var(--s2);border-radius:var(--r-sm);cursor:pointer}
.seg button.on{background:var(--ac);color:var(--on);font-weight:var(--fw-strong)}
input,select,textarea{display:block;width:100%;min-width:0;max-width:100%;font:inherit;font-size:var(--fs-input);line-height:var(--lh-base);min-height:var(--h-ctl);padding:var(--s1) var(--s3);border:var(--bd) solid var(--ln);border-radius:var(--r-md);background:var(--fld);color:var(--ink)}
textarea{min-height:calc(var(--h-ctl)*2)}
input::placeholder,textarea::placeholder{color:var(--mu)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--ac);outline-offset:0;border-color:var(--ac)}
button:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
option{background:var(--cd);color:var(--ink)}
input[type="file"][hidden]{display:none}
label{display:block;margin-bottom:var(--s2);font-size:var(--fs-xs);line-height:var(--lh-base);color:var(--mu)}
label>*{margin-top:var(--s1);color:var(--ink)}
.vw{min-height:var(--h-ctl);padding:var(--s2) var(--s3);border:var(--bd) dashed var(--ln);border-radius:var(--r-md);font-weight:var(--fw-strong);background:var(--fld)}
#v_sch{min-height:0;padding:0;border:0;font-weight:var(--fw-regular);background:none}

/* ===== الشريط العلوي والتنقل ===== */
header{position:sticky;top:var(--sat);z-index:8;height:var(--h-bar);display:flex;align-items:center;justify-content:space-between;gap:var(--s3);padding:0 var(--gx);background:var(--glass-strong);border-bottom:var(--bd) solid var(--glass-border);box-shadow:inset 0 1px 0 var(--glass-hi);-webkit-backdrop-filter:var(--blur-lg);backdrop-filter:var(--blur-lg)}
header b{font-size:var(--fs-md);line-height:var(--lh-tight)}
body::before{content:"";position:fixed;inset:0 0 auto;height:var(--sat);z-index:9;background:var(--glass-strong);-webkit-backdrop-filter:var(--blur-lg);backdrop-filter:var(--blur-lg)}
nav{position:fixed;inset:auto 0 0;display:flex;z-index:5;min-height:calc(var(--h-nav) + var(--sab));padding:0 var(--sal) var(--sab) var(--sar);background:var(--glass-strong);border-top:var(--bd) solid var(--glass-border);box-shadow:inset 0 1px 0 var(--glass-hi);-webkit-backdrop-filter:var(--blur-lg);backdrop-filter:var(--blur-lg)}
nav button{flex:1 1 0;min-width:0;font:inherit;font-size:var(--fs-2xs);line-height:var(--lh-tight);border:0;background:none;color:var(--mu);padding:var(--s2) var(--s1);cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
nav button span{display:block;font-size:var(--ic);line-height:var(--s6);height:var(--s6)}
nav button.on{color:var(--ink);font-weight:var(--fw-strong)}
nav button.on span{background:var(--sf2);border-radius:var(--r-full);width:calc(var(--s8) + var(--s4));margin:0 auto}

/* ===== النوافذ والتنبيهات ===== */
#m{position:fixed;inset:0;z-index:9;display:flex;align-items:flex-end;justify-content:center;padding:0 max(var(--s3),var(--sal)) calc(var(--s3) + var(--sab)) max(var(--s3),var(--sar));background:var(--scrim)}
#m[hidden]{display:none}
.sheet{width:100%;min-width:0;max-width:var(--w-page);max-height:calc(100vh - var(--sat) - var(--sab) - var(--s6));max-height:calc(100dvh - var(--sat) - var(--sab) - var(--s6));overflow:auto;overscroll-behavior:contain;padding:var(--s4);border-radius:var(--r-xl);border:var(--bd) solid var(--glass-border);color:var(--ink);background:var(--glass-strong);box-shadow:inset 0 1px 0 var(--glass-hi),var(--sh-2);-webkit-backdrop-filter:var(--blur-lg);backdrop-filter:var(--blur-lg)}
.sheet h3{margin:0 0 var(--s3);font-weight:var(--fw-strong);font-size:var(--fs-md);line-height:var(--lh-tight)}
.sheet.pop{position:fixed;width:var(--w-pop);max-width:calc(100vw - var(--s6))}
.row{display:flex;gap:var(--s2);margin-top:var(--s1)}.row .btn{flex:1;min-width:0}
#er{margin-bottom:var(--s2)}
#toast{position:fixed;inset-inline:0;margin:0 auto;width:max-content;max-width:calc(100% - var(--s8));bottom:calc(var(--h-nav) + var(--sab) + var(--s3));padding:var(--s2) var(--s4);border-radius:var(--r-full);font-size:var(--fs-sm);background:var(--glass-strong);border:var(--bd) solid var(--glass-border);color:var(--ink);box-shadow:var(--sh-2);-webkit-backdrop-filter:var(--blur-lg);backdrop-filter:var(--blur-lg);z-index:20;pointer-events:none;display:none}
#toast.on{display:block}

/* ===== التوافق والأداء ===== */
@media (max-width:480px){.sc{grid-template-columns:repeat(2,minmax(0,1fr))}.row2>b{max-width:55%}}
@media (max-width:360px){.t td,.t th{font-size:var(--fs-xs);padding-inline:var(--s1)}.cb em{min-width:76px}.act .btn.s{flex:1 1 auto}}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.g2,.hero,header,nav,.sheet,#toast,body::before{background:var(--cd)}}
@media (prefers-reduced-transparency:reduce){.card,.list,.t,.bars,.al,.g2,.hero,header,nav,.sheet,#toast,.btn.g,.chip,body::before{background:var(--cd);-webkit-backdrop-filter:none;backdrop-filter:none}.hero{background:var(--ac);color:var(--on)}.hero small{color:var(--on)}}

/* ===== مكتبة المكونات (Component Kit) — حالات ثابتة بلا حركة ===== */
/* الأزرار: Primary=.btn · Secondary=.btn.g · Tertiary=.btn.t · Danger=.btn.d · Success=.btn.ok · Icon=.icb */
.btn.t{background:transparent;border-color:transparent;color:var(--ac);box-shadow:none}
.btn.ok{background:var(--gr);color:var(--on)}
.icb{display:inline-flex;align-items:center;justify-content:center;flex:none;width:var(--h-ctl);height:var(--h-ctl);padding:0;font:inherit;font-size:var(--ic);line-height:1;border-radius:var(--r-md);border:var(--bd) solid var(--glass-border);background:var(--glass-strong);color:var(--ink);cursor:pointer;box-shadow:inset 0 1px 0 var(--glass-hi)}
.icb.sel{background:var(--ac);color:var(--on)}
/* حالات التفاعل: Focused / Disabled / Error / Success */
button:focus-visible,.is-focus{outline:2px solid var(--ac);outline-offset:2px}
input:focus,select:focus,textarea:focus,input.is-focus,select.is-focus{outline:0;border-color:var(--ac);box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 32%,transparent)}
.btn:disabled,.icb:disabled,.chip:disabled,input:disabled,select:disabled,textarea:disabled,.is-disabled{opacity:.45;cursor:not-allowed}
.is-error,input[aria-invalid="true"]{border-color:var(--rd)!important;background:color-mix(in srgb,var(--rd) 8%,var(--fld))}
.is-ok{border-color:var(--gr)!important;background:color-mix(in srgb,var(--gr) 8%,var(--fld))}
.msg{margin-top:var(--s1);font-size:var(--fs-xs);line-height:var(--lh-base)}.msg.err{color:var(--rd)}.msg.ok{color:var(--gr)}
/* حقل البحث */
#q,input[type="search"]{-webkit-appearance:none;appearance:none;border-radius:var(--r-full);padding-inline:var(--s4);background:var(--glass-strong)}
/* مفتاح تبديل / خانة اختيار / زر اختيار (مكتبة فقط) */
input.chk,input.rad,input.sw{-webkit-appearance:none;appearance:none;display:inline-block;flex:none;position:relative;margin:0;padding:0;min-height:0;vertical-align:middle;cursor:pointer;background:var(--fld);border:var(--bd) solid var(--ln)}
input.chk{width:var(--s5);height:var(--s5);border:2px solid var(--mu);border-radius:var(--s1)}
input.chk:checked{background:var(--ac);border-color:var(--ac)}

/* ===== الحركات (Motion Kit) — تتبع إعداد «الحركات» وإعداد الجهاز ===== */
:root{--spring:cubic-bezier(.34,1.56,.64,1)}
@keyframes rpl{to{transform:scale(2.4);opacity:0}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}

@keyframes mesh{0%,100%{transform:translate3d(0,0,0) scale(1)}50%{transform:translate3d(-4%,3%,0) scale(1.06)}}
/* 1) Ripple للأزرار */
.btn,.chip,.icb{position:relative;overflow:hidden;-webkit-tap-highlight-color:transparent;transition:transform .18s var(--spring)}
.btn:active,.chip:active,.icb:active{transform:scale(.97)}
.rpl{position:absolute;border-radius:50%;background:currentColor;opacity:.28;transform:scale(0);pointer-events:none;animation:rpl .55s ease-out forwards}
/* 2) Spring Toast */
#toast{display:block;opacity:0;visibility:hidden;transform:translateY(24px) scale(.9);transition:opacity .3s,transform .35s var(--spring),visibility 0s .35s}
#toast.on{opacity:1;visibility:visible;transform:none;transition:opacity .3s,transform .35s var(--spring),visibility 0s}
#toast[data-t="ok"]{border-color:var(--gr)}#toast[data-t="err"]{border-color:var(--rd)}
/* 3) بطاقة زجاجية تفاعلية (.card.fx) */
.card.fx{-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);transition:background .3s,transform .3s var(--spring)}
@media (hover:hover){.card.fx:hover{background:var(--glass-strong);transform:translateY(-1px)}}
/* 4) خلفية Mesh متحركة بألوان الثيم (transform فقط لأداء أفضل) */
body::after{inset:-15%;will-change:transform;animation:mesh 28s ease-in-out infinite}
/* 5) مؤشر تبويب منزلق في شريط التنقل (يدعم RTL) */
nav::before{content:"";position:absolute;top:0;inset-inline-start:0;width:calc(100%/var(--n,6));height:3px;background:linear-gradient(var(--ac),var(--ac)) center/32px 100% no-repeat;transform:translateX(calc(var(--i,0)*-100%));transition:transform .35s var(--spring)}
/* انتقال المحتوى والنوافذ */
#v.swap{animation:rise .3s ease-out}
#m:not([hidden]){animation:fade .2s ease-out}
.sheet{animation:sheetIn .38s var(--spring)}

/* ===== Warm Palette Tokens — Champagne Gold / Soft Bronze / Warm Brown (طبقة إضافية فوق الهوية الأصلية) ===== */
:root{--c-gold:#D6B66D;--c-bronze:#B58A50;--c-brown:#8C6743;--c-pale:#E9D9AE;

--au-g:rgba(214,182,109,.15);--au-b:rgba(181,138,80,.16);--au-br:rgba(140,103,67,.24);--au-p:rgba(233,217,174,.07);--au-s:rgba(233,217,174,.04)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]):not([data-theme="dark"]){--w-fill:#D6B66D;--w-ico:#D6B66D;--w-num:#E9D9AE;--w-sec:#B58A50;--w-line:rgba(214,182,109,.26);--w-line2:rgba(181,138,80,.24);--w-soft:rgba(214,182,109,.14);
--au-g:rgba(214,182,109,.15);--au-b:rgba(181,138,80,.16);--au-br:rgba(140,103,67,.24);--au-p:rgba(233,217,174,.07);--au-s:rgba(233,217,174,.04)}}

<script>
const K='masroofi_v1',$=s=>document.querySelector(s);
let S={tx:[],debts:[],inst:[],theme:''};
try{const x=JSON.parse(localStorage.getItem(K));if(x&&x.tx)S=x}catch(e){}
let st='busy';const SYT={ok:'متزامن مع السحابة',busy:'قيد المزامنة',err:'فشلت المزامنة',off:'غير متصل (التغييرات محفوظة محلياً)'};const dot=()=>{const s=navigator.onLine?st:'off',d=$('#sd'),y=$('#sy');if(d)d.dataset.s=s;if(y){const n=Object.keys(S.pend||{}).length;y.textContent=SYT[s]+(n?' – '+n+' عملية معلّقة':'')}};
const IDB=(()=>{let p=null;const open=()=>p||(p=new Promise(r=>{try{const q=indexedDB.open('masroofi-local',1);q.onupgradeneeded=()=>q.result.createObjectStore('kv');q.onsuccess=()=>r(q.result);q.onerror=q.onblocked=()=>r(null)}catch(e){r(null)}}));

 return{get:k=>tx('readonly',o=>o.get(k)),put:(k,v)=>tx('readwrite',o=>o.put(v,k)).then(r=>r!==null)}})();

const save=l=>{if(!l){S.at=Date.now();FB.track()}persistLocal().then(ok=>{if(!ok){st='err';dot()}});if(!l)FB.push()};
addEventListener('online',dot);addEventListener('offline',dot);

const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const iso=d=>new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
const today=()=>iso(new Date()),pd=s=>new Date(s+'T00:00:00');

const TABS=[['home','🏠','الرئيسية'],['ops','🧾','العمليات'],['debt','🤝','الديون'],['inst','📅','الأقساط'],['rep','📊','التقارير'],['set','⚙️','الإعدادات']];

/* حسابات */
const T=(ty,f)=>S.tx.filter(t=>t.type==ty&&(!f||f(t))).reduce((s,t)=>s+ +t.amt,0);

 if(i.freq=='m'){d.setMonth(d.getMonth()+p+k);return iso(d)}

 while(n>0){d.setDate(d.getDate()+1);if(!sk(d))n--}

 S.inst.forEach(i=>{const d=nextI(i);if(d&&d<=n3)a.push((d<t?'⚠️ قسط متأخر: ':'⏰ قسط قريب: ')+esc(i.name)+' ('+d+')')});

const SRT=[['dn','الأحدث أولاً','date'],['da','الأقدم أولاً','date'],['ad','الأعلى أولاً','amt'],['aa','الأقل أولاً','amt']];

const V={
home(){const i=T('inc'),e=T('exp'),al=alerts().map(x=>`<div class="al">${x}</div>`).join('');

 ${al?'<h2>تنبيهات</h2>'+al:''}
 <h2>الأقساط القادمة</h2>${ni.length?`<div class="list">${ni.map(x=>`<div class="row2" data-a="tab" data-id="inst"><div><b>${esc(x.name)}</b><small>${nextI(x)}</small></div><b>${fmt(x.per)}</b></div>`).join('')}</div>`:'<div class="list empty">لا توجد أقساط.</div>'}
 <h2>آخر العمليات</h2>${list(sorted(S.tx).slice(0,5).map(txRow))}`},
ops(){const sg=(t,k)=>`<small>${t}</small>`+SRT.filter(o=>o[2]==k).map(o=>`<button role="menuitemradio" aria-checked="${srt==o[0]}" class="${srt==o[0]?'on':''}" data-a="srt" data-id="${o[0]}"><i>${srt==o[0]?'✓':''}</i>${o[1]}</button>`).join('');

/* Firebase sync عبر REST/Fetch: وثيقة ثابتة users/local_device_user بدون SDK وبدون تسجيل دخول */
const FBC={apiKey:"AIzaSyAa2aO3M_0Af0W22fxL4GcWHqzhV3k21Kw",projectId:"masrofi2-1"};
const FB=(()=>{
 /* مزامنة لكل سجل: users/local_device_user.recs[id] = {k:النوع, u:وقت آخر تعديل, d:1 للمحذوف (Tombstone), v:نص JSON للسجل}
    - كل تغيير محلي يُسجَّل في S.meta (الطابع الزمني والبصمة) وS.pend (العمليات المعلّقة) ويُحفظ مع الحالة في IndexedDB/localStorage.
    - لا تُحذف S.pend[id] إلا بعد نجاح الكتابة في Firestore (تأكيد الخادم). */
 const KINDS=['tx','debts','inst'],DOC='local_device_user';
 const PATH='projects/'+FBC.projectId+'/databases/(default)/documents',BASE='https://firestore.googleapis.com/v1/'+PATH,KEY='key='+FBC.apiKey;
 let started=0,inflight=0,pulling=0,pulled=false,lerr=false,ferr=false,tries=0,tm=null,tr=null;
 const pc=()=>Object.keys(S.pend||{}).length;
 const upd=()=>{st=!navigator.onLine?'off':(lerr||ferr)?'err':(pc()||inflight||!pulled)?'busy':'ok';dot()};
 const persist=()=>{persistLocal()};
 const re=()=>{const a=document.activeElement;if(a&&a.id=='q'){ol()}else render()};
 const retry=()=>{clearTimeout(tr);tr=setTimeout(flush,Math.min(30000,2000*2**tries++))};

 /* ===== طبقة REST ===== */
 async function api(url,opt){const c=new AbortController(),t=setTimeout(()=>c.abort(),15000);
  try{const r=await fetch(url,Object.assign({signal:c.signal},opt)),j=await r.json().catch(()=>({}));
   if(!r.ok){const e=new Error((j.error&&j.error.message)||('HTTP '+r.status));e.status=r.status;e.code=j.error&&j.error.status;throw e}
   return j}finally{clearTimeout(t)}}
 function dec(v){if(!v)return null;
  if('stringValue'in v)return v.stringValue;if('integerValue'in v)return +v.integerValue;if('doubleValue'in v)return v.doubleValue;if('booleanValue'in v)return v.booleanValue;
  if('mapValue'in v){const o={},f=v.mapValue.fields||{};for(const k in f)o[k]=dec(f[k]);return o}
  if('arrayValue'in v)return(v.arrayValue.values||[]).map(dec);return null}
 const enc=it=>({mapValue:{fields:{k:{stringValue:it.k},u:{integerValue:String(it.u)},d:{integerValue:String(it.d)},v:{stringValue:it.v}}}});
 async function getDoc(){
  try{const j=await api(BASE+'/users/'+DOC+'?'+KEY);return{exists:true,time:j.updateTime,data:dec({mapValue:{fields:j.fields||{}}})}}
  catch(e){if(e.status==404)return{exists:false,data:null};throw e}}

 /* يقارن الحالة الحالية بآخر بصمة معروفة ويسجل الإضافات/التعديلات/الحذوفات كعمليات معلقة بطابع زمني */
 function track(){
  const base=!S.meta;if(base)S.meta={};if(!S.pend)S.pend={};
  const now=Date.now(),t0=base?(S.at||now):now,seen=new Set();let ch=false;
  KINDS.forEach(k=>(S[k]||[]).forEach(x=>{
   if(!x||!x.id)return;seen.add(x.id);const h=JSON.stringify(x),m=S.meta[x.id];
   if(!m||m.h!==h||m.d){S.meta[x.id]={k,u:Math.max(t0,m?m.u+1:0),d:0,h};S.pend[x.id]=1;ch=true}}));
  for(const id in S.meta){const m=S.meta[id];
   if(!m.d&&!seen.has(id)){S.meta[id]={k:m.k,u:Math.max(now,m.u+1),d:1,h:''};S.pend[id]=1;ch=true}}
  return ch}
 function upsert(k,x){const a=S[k]||(S[k]=[]),o=a.find(y=>y.id==x.id);
  if(o){Object.keys(o).forEach(p=>delete o[p]);Object.assign(o,x)}else a.push(x)}
 function removeId(id){let r=false;KINDS.forEach(k=>{const a=S[k];if(!a)return;const i=a.findIndex(y=>y.id==id);if(i>=0){a.splice(i,1);r=true}});return r}

 /* دمج حالة الخادم: الأحدث (بالطابع الزمني) يفوز، ولا يستبدل قديمٌ جديداً */
 function mergeRemote(r,server){
  let ch=false;const recs=(r&&r.recs)||{};
  if(!S.meta)S.meta={};if(!S.pend)S.pend={};
  for(const id in recs){const rr=recs[id];
   if(!rr||typeof rr.u!='number'||KINDS.indexOf(rr.k)<0)continue;
   const lm=S.meta[id];
   if(!lm||rr.u>lm.u){
    if(rr.d){if(removeId(id))ch=true;S.meta[id]={k:rr.k,u:rr.u,d:1,h:''}}
    else{let x;try{x=JSON.parse(rr.v)}catch(e){continue}upsert(rr.k,x);S.meta[id]={k:rr.k,u:rr.u,d:0,h:JSON.stringify(x)};ch=true}
    delete S.pend[id]}
   else if(rr.u==lm.u){if(S.pend[id]&&!!rr.d==!!lm.d)delete S.pend[id]}
   else if(server&&!S.pend[id])S.pend[id]=1}
  /* هجرة النسخة القديمة (blob واحد): تُضاف السجلات غير المعروفة محلياً مرة واحدة ولا تُستبدل بها سجلات موجودة */
  if(server&&r&&r.data&&!S.lg){try{const d=JSON.parse(r.data);
   KINDS.forEach(k=>(d[k]||[]).forEach(x=>{if(!x||!x.id||S.meta[x.id])return;upsert(k,x);S.meta[x.id]={k,u:r.at||1,d:0,h:JSON.stringify(x)};ch=true}));S.lg=1}catch(e){}}
  /* سجل محلي غير موجود على الخادم ولا معلّق: يُرفع */
  if(server)for(const id in S.meta)if(!recs[id]&&!S.pend[id])S.pend[id]=1;
  return ch}

 /* رفع العمليات المعلقة: قراءة الوثيقة ثم كتابة بشرط updateTime (معاملة تفاؤلية)؛ عند التعارض تُعاد العملية */
 async function flush(){
  if(inflight||!navigator.onLine)return;
  const ids=Object.keys(S.pend||{});if(!ids.length){upd();return}
  const idx=new Map();KINDS.forEach(k=>(S[k]||[]).forEach(x=>idx.set(x.id,x)));
  const items=[];
  ids.forEach(id=>{const m=S.meta[id];
   if(!m||(!m.d&&!idx.has(id))){delete S.pend[id];return}
   if(items.length<150)items.push({id,k:m.k,u:m.u,d:m.d?1:0,v:m.d?'':m.h})});
  if(!items.length){persist();upd();return}
  const before=pc();let conflict=false;inflight=1;upd();
  try{
   const s=await getDoc(),cur=(s.exists&&s.data&&s.data.recs)||{},recs=Object.assign({},cur),w=[];
   items.forEach(it=>{const rr=cur[it.id];if(rr&&rr.u>=it.u)return;w.push(it);recs[it.id]={k:it.k,u:it.u,d:it.d,v:it.v}});
   if(w.length){
    const fields={recs:{mapValue:{fields:{}}},ver:{integerValue:'2'}};
    w.forEach(it=>{fields.recs.mapValue.fields[it.id]=enc(it)});
    await api(BASE+':commit?'+KEY,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({writes:[{
     update:{name:PATH+'/users/'+DOC,fields},
     updateMask:{fieldPaths:['ver'].concat(w.map(it=>'recs.`'+it.id+'`'))},
     currentDocument:s.exists?{updateTime:s.time}:{exists:false}}]})})}
   let stale=false;
   items.forEach(it=>{const rr=recs[it.id],m=S.meta[it.id];
    if(rr&&rr.u>it.u){stale=true;return}
    if(m&&m.u===it.u)delete S.pend[it.id]});
   ferr=false;tries=0;
   if(stale&&mergeRemote({recs},true))re();
   persist()
  }catch(e){
   if(e.status==409||e.code=='ABORTED'||e.code=='FAILED_PRECONDITION'||e.code=='ALREADY_EXISTS')conflict=true;
   else{console.error('Firestore sync failed',e);ferr=true;retry()}}
  finally{inflight=0;upd()}
  if(conflict)setTimeout(flush,200+Math.random()*600);
  else if(!ferr&&pc()&&pc()<before)setTimeout(flush,0);
  else if(!ferr&&pc()&&pc()>=before){retry()}}
 function push(){upd();clearTimeout(tm);tm=setTimeout(flush,500)}

 /* سحب حالة السحابة ودمجها (بديل onSnapshot): يعمل عند الإقلاع وعودة الاتصال وفتح التطبيق وبشكل دوري */
 async function pull(){
  if(pulling||!navigator.onLine)return;pulling=1;
  try{const s=await getDoc();lerr=false;pulled=true;
   const ch=mergeRemote(s.exists?s.data:null,true);
   if(ch){persist();re()}else persist()
  }catch(e){console.error('Firestore pull failed',e);lerr=true}
  finally{pulling=0;upd()}
  flush()}
 function recheck(){if(track())persist();upd();flush()}
 function boot(){if(started)return;started=1;pull()}

 addEventListener('online',()=>{lerr=false;ferr=false;tries=0;upd();pull()});

 setInterval(()=>{if(started&&navigator.onLine&&pc()&&!inflight)flush()},8000);

 return{push,boot,recheck,track}})();

IDB.get('state').then(v=>{if(v&&Array.isArray(v.tx)&&(v.at||0)>(S.at||0)){S=Object.assign({tx:[],debts:[],inst:[],theme:''},v);try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}render();FB.recheck()}else if(v!==null)IDB.put('state',S)});

render();dot();
